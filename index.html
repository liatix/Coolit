  <style>
    :root{
      --navy:#071f2e;--navy2:#0c3044;--cream:#f5eee3;--ivory:#fffaf2;
      --gold:#d8b46d;--gold2:#f0d69a;--ink:#112b3a;--muted:#6c777d;
      --line:rgba(7,31,46,.13);--white:#fff;--max:1240px;
      --shadow:0 22px 60px rgba(7,31,46,.13)
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--ivory);color:var(--ink);font-family:"Heebo",Arial,sans-serif;line-height:1.65;overflow-x:hidden}
    img{display:block;width:100%;height:100%;object-fit:cover}
    a{text-decoration:none;color:inherit}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    .wrap{width:min(var(--max),calc(100% - 36px));margin-inline:auto}
    .serif{font-family:"Secular One","Heebo",sans-serif;font-weight:400}
    .section{padding:105px 0}
    .eyebrow{color:#9f763d;font-weight:800;font-size:.78rem;letter-spacing:.06em;display:flex;align-items:center;gap:12px}
    .eyebrow:before{content:"";width:42px;height:1px;background:var(--gold)}
    .title{font-size:clamp(2.55rem,5vw,4.9rem);line-height:1.04;letter-spacing:-.035em;margin:12px 0 22px}
    .lead{max-width:760px;color:var(--muted);font-size:1.08rem}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:54px;padding:0 24px;border-radius:999px;border:1px solid transparent;font-weight:800;transition:.22s ease}
    .btn:hover{transform:translateY(-2px)}
    .btn-primary{background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--navy);box-shadow:0 10px 28px rgba(216,180,109,.22)}
    .btn-outline{border-color:rgba(255,255,255,.43);color:#fff;background:rgba(255,255,255,.035)}
    .btn-dark{border-color:rgba(7,31,46,.2);color:var(--navy);background:transparent}

    header{position:fixed;z-index:100;inset:0 0 auto;transition:.25s ease;color:#fff}
    header.scrolled{background:rgba(7,31,46,.91);backdrop-filter:blur(14px);box-shadow:0 8px 26px rgba(0,0,0,.12)}
    .nav{min-height:80px;display:flex;align-items:center;justify-content:space-between;gap:22px;border-bottom:1px solid rgba(255,255,255,.12)}
    .brand b{display:block;font-size:1.12rem}.brand span{display:block;font-size:.72rem;color:rgba(255,255,255,.7)}
    .navlinks{display:flex;gap:22px;font-size:.87rem;color:rgba(255,255,255,.82)}
    .navlinks a{position:relative}
    .navlinks a:after{content:"";position:absolute;right:0;bottom:-7px;width:0;height:1px;background:var(--gold);transition:.2s}
    .navlinks a:hover:after{width:100%}
    .nav-actions{display:flex;gap:9px}

    .hero{min-height:860px;position:relative;display:flex;align-items:center;color:#fff;overflow:hidden;background:var(--navy)}
    .hero-media{position:absolute;inset:0}
    .hero-media:after{content:"";position:absolute;inset:0;background:
      linear-gradient(90deg,rgba(5,23,34,.98) 0%,rgba(5,23,34,.90) 38%,rgba(5,23,34,.50) 70%,rgba(5,23,34,.20) 100%),
      linear-gradient(0deg,rgba(5,23,34,.5),transparent 55%)}
    .hero-media img{transform:scale(1.02);transition:transform 7s ease}
    .hero:hover .hero-media img{transform:scale(1.055)}
    .hero-content{position:relative;z-index:2;width:min(760px,100%);padding-top:90px}
    .hero-kicker{color:var(--gold2);font-weight:700}
    .hero h1{font-size:clamp(3.8rem,7.8vw,7.4rem);line-height:.97;letter-spacing:-.045em;margin:14px 0 26px}
    .hero h1 strong{color:var(--gold2);font-weight:400}
    .hero p{max-width:650px;font-size:clamp(1.08rem,2vw,1.38rem);color:rgba(255,255,255,.87)}
    .hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}
    .hero-features{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:54px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.12)}
    .hero-feature{padding:18px 17px;background:rgba(7,31,46,.53);backdrop-filter:blur(8px)}
    .hero-feature b{display:block;color:var(--gold2);font-size:.9rem}.hero-feature span{font-size:.78rem;color:rgba(255,255,255,.68)}

    .intro{background:var(--cream)}
    .intro-grid{display:grid;grid-template-columns:1fr .9fr;gap:70px;align-items:center}
    .intro-photo{height:520px;border-radius:28px;overflow:hidden;box-shadow:var(--shadow);position:relative}
    .intro-photo:after{content:"";position:absolute;inset:0;border:1px solid rgba(255,255,255,.42);border-radius:28px;pointer-events:none}

    .equipment{background:var(--navy);color:#fff}
    .equipment .eyebrow{color:var(--gold2)}.equipment .lead{color:rgba(255,255,255,.68)}
    .equip-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-top:44px}
    .equipment-card{background:#fff;color:var(--ink);border-radius:22px;overflow:hidden;box-shadow:0 15px 40px rgba(0,0,0,.12);transition:.28s ease}
    .equipment-card:hover{transform:translateY(-7px);box-shadow:0 24px 56px rgba(0,0,0,.22)}
    .equipment-img{height:235px;overflow:hidden;position:relative}
    .equipment-img img{transition:transform .55s cubic-bezier(.2,.7,.2,1),filter .4s}
    .equipment-card:hover img{transform:scale(1.065);filter:saturate(1.06) contrast(1.02)}
    .equipment-img:after{content:"";position:absolute;inset:auto 0 0;height:38%;background:linear-gradient(transparent,rgba(7,31,46,.13));pointer-events:none}
    .equipment-body{padding:23px}.equipment-body h3{font-size:1.38rem;margin:0 0 8px}.equipment-body p{font-size:.93rem;color:var(--muted);margin:0}
    .equipment-body small{display:block;margin-top:15px;color:#9d7438;font-weight:700}

    .event-types{background:var(--ivory)}
    .types-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:40px}
    .type{padding:24px 20px;border:1px solid var(--line);background:#fff;border-radius:18px;transition:.22s}
    .type:hover{transform:translateY(-4px);border-color:rgba(216,180,109,.55);box-shadow:var(--shadow)}
    .type .ico{font-size:1.65rem;color:#a77836}.type b{display:block;margin-top:12px}.type p{font-size:.83rem;color:var(--muted);margin:7px 0 0}

    .gallery-section{background:var(--cream)}
    .gallery{display:grid;grid-template-columns:1.15fr .85fr .85fr;grid-template-rows:320px 320px;gap:12px;margin-top:40px}
    .shot{position:relative;overflow:hidden;border-radius:20px;background:var(--navy)}
    .shot:first-child{grid-row:1/3}.shot:nth-child(4){grid-column:2/4}
    .shot img{transition:transform .65s cubic-bezier(.2,.7,.2,1),filter .5s}
    .shot:hover img{transform:scale(1.07);filter:saturate(1.08)}
    .shot:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 46%,rgba(4,20,30,.82));opacity:.76;transition:.3s}
    .shot:hover:after{opacity:.9}
    .shot figcaption{position:absolute;z-index:2;right:20px;bottom:17px;color:#fff;font-weight:700;transform:translateY(5px);transition:.3s}
    .shot:hover figcaption{transform:translateY(0);color:var(--gold2)}
    .gold-line{position:absolute;z-index:2;right:20px;bottom:48px;width:0;height:1px;background:var(--gold2);transition:.35s}
    .shot:hover .gold-line{width:58px}

    .process{background:#fff}
    .steps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:42px}
    .step{padding:27px;border-top:1px solid var(--gold);background:linear-gradient(180deg,#fff,var(--ivory));border-radius:0 0 18px 18px}
    .step-num{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:var(--navy);font-weight:900;margin-bottom:16px}
    .step b{font-size:1.06rem}.step p{font-size:.86rem;color:var(--muted);margin:7px 0 0}

    .faq{background:var(--ivory)}
    details{border-bottom:1px solid var(--line);padding:18px 0}
    summary{cursor:pointer;font-weight:800;list-style:none;display:flex;justify-content:space-between;gap:20px}
    summary::-webkit-details-marker{display:none}
    summary:after{content:"+";color:#a67634;font-size:1.4rem}
    details[open] summary:after{content:"âˆ’"}
    details p{color:var(--muted);max-width:850px}

    .contact{background:linear-gradient(120deg,#061b28,#0c354c);color:#fff}
    .contact-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:70px;align-items:start}
    .contact .eyebrow{color:var(--gold2)}.contact .lead{color:rgba(255,255,255,.7)}
    .contact-points{display:grid;gap:12px;margin-top:30px}.contact-point{display:flex;gap:12px;align-items:center;color:rgba(255,255,255,.8)}
    .form-card{background:var(--ivory);color:var(--ink);padding:32px;border-radius:24px;box-shadow:0 26px 70px rgba(0,0,0,.21)}
    .form-card h3{font-size:1.65rem;margin:0 0 6px}.form-card>p{color:var(--muted);margin:0 0 22px}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .field{display:grid;gap:6px}.field.full{grid-column:1/-1}
    label{font-size:.82rem;font-weight:700;color:#43515a}
    input,select,textarea{width:100%;border:1px solid rgba(7,31,46,.16);background:#fff;border-radius:11px;padding:12px 13px;color:var(--ink);outline:none;transition:.2s}
    textarea{min-height:112px;resize:vertical}
    input:focus,select:focus,textarea:focus{border-color:#bf934d;box-shadow:0 0 0 3px rgba(216,180,109,.16)}
    .form-note{font-size:.74rem;color:var(--muted);margin:11px 0 0}
    .honeypot{position:fixed!important;left:0!important;top:0!important;width:1px!important;height:1px!important;max-width:1px!important;overflow:hidden!important;clip-path:inset(50%)!important;opacity:0!important;pointer-events:none!important}
    footer{background:#041722;color:rgba(255,255,255,.63)}
    .footer{min-height:86px;display:flex;justify-content:space-between;align-items:center;gap:18px;font-size:.8rem}.footer b{color:#fff}
    .float-wa{position:fixed;z-index:120;left:17px;bottom:17px;width:58px;height:58px;display:grid;place-items:center;border-radius:50%;background:var(--gold);color:var(--navy);font-size:1.35rem;font-weight:900;box-shadow:0 13px 36px rgba(0,0,0,.24);transition:.2s}.float-wa:hover{transform:scale(1.07)}

    .reveal{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s ease}
    .reveal.visible{opacity:1;transform:none}
    @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.reveal{opacity:1;transform:none;transition:none}.hero-media img,.equipment-img img,.shot img{transition:none}.hero:hover .hero-media img{transform:scale(1.02)}}
    @media(max-width:980px){
      .navlinks{display:none}.hero{min-height:790px;align-items:end}.hero-media:after{background:linear-gradient(180deg,rgba(5,23,34,.25),rgba(5,23,34,.88) 58%,rgba(5,23,34,.98))}
      .hero-content{padding:150px 0 65px}.hero-features{grid-template-columns:1fr 1fr}
      .intro-grid,.contact-grid{grid-template-columns:1fr}.equip-grid{grid-template-columns:1fr 1fr}.types-grid{grid-template-columns:repeat(3,1fr)}
      .gallery{grid-template-columns:1fr 1fr;grid-template-rows:390px 270px 270px}.shot:first-child{grid-column:1/3;grid-row:auto}.shot:nth-child(4){grid-column:1/3}
      .steps{grid-template-columns:1fr 1fr}
    }
    @media(max-width:620px){
      .wrap{width:min(var(--max),calc(100% - 24px))}.nav{min-height:70px}.nav-actions .phone{display:none}.hero h1{font-size:3.25rem}.hero p{font-size:1rem}
      .hero-actions{display:grid}.btn{width:100%}.hero-features{grid-template-columns:1fr 1fr;margin-top:34px}.hero-feature{padding:14px 12px}
      .section{padding:76px 0}.intro-photo{height:390px}.equip-grid,.types-grid,.steps{grid-template-columns:1fr}.equipment-img{height:250px}
      .gallery{display:grid;grid-template-columns:1fr;grid-template-rows:none}.shot,.shot:first-child,.shot:nth-child(4){grid-column:auto;grid-row:auto;height:300px}.shot:first-child{height:410px}
      .form-grid{grid-template-columns:1fr}.footer{padding:22px 0;flex-direction:column;text-align:center;justify-content:center}
    }
  
    .brand{display:flex;align-items:center;gap:10px}
    .brand-logo{width:auto;height:72px;max-width:290px;object-fit:contain;display:block}
    .brand-text{display:none}
    @media(max-width:620px){.brand-logo{height:56px;max-width:220px}}

  
    .form-status{margin-top:12px;padding:12px 14px;border-radius:10px;font-size:.88rem;display:none}
    .form-status.success{display:block;background:#e8f5eb;color:#1d6230;border:1px solid #b9dfc3}
    .form-status.error{display:block;background:#fff0ee;color:#8b3027;border:1px solid #efc3be}
